<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaborations - JongoCollab</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/student_db.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { background: var(--color-bg-main); font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    .dashboard-container { display: flex; min-height: 100vh; }
    .sidebar { width: 280px; flex-shrink: 0; position: fixed; left: 0; top: 0; height: 100vh; overflow-y: auto; z-index: 100; }
    .main-content { margin-left: 280px; flex: 1; padding: 2rem; min-height: 100vh; }
    .collab-header { background: linear-gradient(135deg, rgba(204,0,255,0.1), rgba(0,255,136,0.1)); padding: 40px; border-radius: 20px; border: 2px solid var(--color-border); margin-bottom: 32px; }
    .collab-title { font-size: 36px; font-weight: 900; background: linear-gradient(135deg, var(--color-accent), var(--color-success)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
    .collab-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .stat-card { background: var(--color-bg-card); padding: 24px; border-radius: 16px; border: 2px solid var(--color-border); transition: all 0.3s; }
    .stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
    .stat-number { font-size: 48px; font-weight: 900; line-height: 1; margin-bottom: 8px; }
    .stat-label { font-size: 14px; color: var(--color-text-secondary); font-weight: 600; text-transform: uppercase; }
    .tabs-container { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 2px solid var(--color-border); overflow-x: auto; }
    .tab-btn { padding: 16px 28px; background: transparent; border: none; border-bottom: 3px solid transparent; font-weight: 700; color: var(--color-text-secondary); cursor: pointer; transition: all 0.3s; position: relative; bottom: -2px; display: flex; align-items: center; gap: 8px; }
    .tab-btn:hover { color: var(--color-accent); }
    .tab-btn.active { color: var(--color-accent); border-bottom-color: var(--color-accent); }
    .tab-badge { padding: 4px 10px; background: var(--color-accent); color: white; border-radius: 12px; font-size: 12px; font-weight: 700; }
    .tab-content { display: none; animation: fadeIn 0.3s; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .collab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; }
    .collab-card { background: var(--color-bg-card); border: 2px solid var(--color-border); border-radius: 16px; overflow: hidden; transition: all 0.3s; }
    .collab-card:hover { border-color: var(--color-accent); box-shadow: 0 8px 32px rgba(204,0,255,0.2); transform: translateY(-4px); }
    .collab-card-header { padding: 24px; background: var(--color-bg-secondary); border-bottom: 2px solid var(--color-border); }
    .project-title-row { display: flex; align-items: center; gap: 12px; }
    .project-icon { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--color-accent), var(--color-info)); display: flex; align-items: center; justify-content: center; color: white; }
    .project-title { flex: 1; font-size: 18px; font-weight: 700; color: var(--color-text-primary); }
    .status-badge { padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .status-accepted { background: rgba(0,255,136,0.15); color: var(--color-success); border: 1px solid var(--color-success); }
    .status-pending { background: rgba(255,184,0,0.15); color: #FFB800; border: 1px solid #FFB800; }
    .status-rejected { background: rgba(231,76,60,0.15); color: #e74c3c; border: 1px solid #e74c3c; }
    .collab-card-body { padding: 24px; }
    .collaborator-section { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--color-border); }
    .collaborator-avatar { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, var(--color-accent), var(--color-info)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 20px; }
    .collaborator-info { flex: 1; }
    .collaborator-name { font-weight: 700; color: var(--color-text-primary); font-size: 16px; display: block; margin-bottom: 4px; }
    .collaborator-school { font-size: 13px; color: var(--color-text-muted); display: flex; align-items: center; gap: 6px; }
    .message-section { background: var(--color-bg-secondary); padding: 16px; border-radius: 12px; margin-bottom: 20px; border-left: 4px solid var(--color-accent); }
    .message-label { font-size: 12px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .message-text { color: var(--color-text-secondary); line-height: 1.6; font-size: 14px; }
    .meta-info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .meta-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-text-muted); }
    .action-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
    .action-btn { padding: 12px 16px; border: 2px solid var(--color-border); background: var(--color-bg-card); border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-accept { border-color: var(--color-success); color: var(--color-success); }
    .btn-accept:hover { background: var(--color-success); color: white; transform: translateY(-2px); }
    .btn-decline { border-color: #e74c3c; color: #e74c3c; }
    .btn-decline:hover { background: #e74c3c; color: white; transform: translateY(-2px); }
    .btn-view { border-color: var(--color-accent); color: var(--color-accent); }
    .btn-view:hover { background: var(--color-accent); color: white; transform: translateY(-2px); }
    .btn-message { border-color: var(--color-info); color: var(--color-info); }
    .btn-message:hover { background: var(--color-info); color: white; }
    .btn-cancel { border-color: var(--color-error); color: var(--color-error); }
    .btn-cancel:hover { background: var(--color-error); color: white; }
    .empty-state { text-align: center; padding: 80px 20px; grid-column: 1/-1; }
    .empty-icon { font-size: 80px; margin-bottom: 24px; opacity: 0.3; }
    .empty-title { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    .empty-action { padding: 14px 28px; background: linear-gradient(135deg, var(--color-accent), var(--color-info)); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 16px; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--color-bg-card); border: 2px solid; border-radius: 12px; padding: 16px 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); z-index: 2000; display: flex; align-items: center; gap: 12px; min-width: 320px; animation: slideIn 0.3s; }
    .toast.success { border-color: var(--color-success); }
    .toast.error { border-color: var(--color-error); }
    @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; width: 100%; padding: 1rem; } .collab-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="logo"><i class="fas fa-graduation-cap"></i><span>JongoColab</span></div>
      <ul class="nav-menu">
        <li class="nav-item"><a href="student_db.html" class="nav-link"><i class="fas fa-chart-line"></i><span>Overview</span></a></li>
        <li class="nav-item"><a href="my_projects.html" class="nav-link"><i class="fas fa-folder"></i><span>My Projects</span></a></li>
        <li class="nav-item"><a href="Community.html" class="nav-link"><i class="fas fa-users"></i><span>Community</span></a></li>
        <li class="nav-item"><a href="collaborations.html" class="nav-link active"><i class="fas fa-handshake"></i><span>Collaborations</span></a></li>
      </ul>
      <ul class="nav-menu nav-bottom">
        <li class="nav-item"><a href="#" class="nav-link"><i class="fas fa-cog"></i><span>Settings</span></a></li>
        <li class="nav-item"><a href="index.html" class="nav-link"><i class="fas fa-sign-out-alt"></i><span>Log Out</span></a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="collab-header">
        <h1 class="collab-title"><i class="fas fa-handshake"></i> My Collaborations</h1>
        <p style="color: var(--color-text-secondary); font-size: 16px;">Manage collaboration requests and connect with students</p>
      </div>

      <div class="collab-stats">
        <div class="stat-card"><div class="stat-number" id="activeCount" style="color: var(--color-success);">0</div><div class="stat-label">Active</div></div>
        <div class="stat-card"><div class="stat-number" id="pendingCount" style="color: #FFB800;">0</div><div class="stat-label">Pending</div></div>
        <div class="stat-card"><div class="stat-number" id="sentCount" style="color: var(--color-info);">0</div><div class="stat-label">Sent</div></div>
        <div class="stat-card"><div class="stat-number" id="totalCount" style="color: var(--color-accent);">0</div><div class="stat-label">Total</div></div>
      </div>

      <div class="tabs-container">
        <button class="tab-btn active" data-tab="pending"><i class="fas fa-inbox"></i> Pending <span class="tab-badge" id="pendingBadge">0</span></button>
        <button class="tab-btn" data-tab="active"><i class="fas fa-check-circle"></i> Active <span class="tab-badge" id="activeBadge">0</span></button>
        <button class="tab-btn" data-tab="sent"><i class="fas fa-paper-plane"></i> Sent <span class="tab-badge" id="sentBadge">0</span></button>
        <button class="tab-btn" data-tab="history"><i class="fas fa-history"></i> History</button>
      </div>

      <div class="tab-content active" id="pendingTab"><div class="collab-grid" id="pendingGrid"></div></div>
      <div class="tab-content" id="activeTab"><div class="collab-grid" id="activeGrid"></div></div>
      <div class="tab-content" id="sentTab"><div class="collab-grid" id="sentGrid"></div></div>
      <div class="tab-content" id="historyTab"><div class="collab-grid" id="historyGrid"></div></div>
    </main>
  </div>

  <script>
    const API = window.location.origin + '/api';
    let received = [], sent = [];

    const getToken = () => localStorage.getItem('authToken');
    const api = async (url, opt = {}) => {
      const res = await fetch(`${API}${url}`, {
        headers: { 'Content-Type': 'application/json', ...(getToken() && { Authorization: `Bearer ${getToken()}` }) },
        ...opt
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Failed');
      return data;
    };

    const toast = (msg, type = 'success') => {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'times-circle'}"></i><span>${msg}</span>`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    };

    const ago = (d) => {
      const s = Math.floor((Date.now() - new Date(d)) / 1000);
      const i = { year: 31536000, month: 2592000, week: 604800, day: 86400, hour: 3600, minute: 60 };
      for (const [u, v] of Object.entries(i)) {
        const n = Math.floor(s / v);
        if (n >= 1) return `${n} ${u}${n > 1 ? 's' : ''} ago`;
      }
      return 'Just now';
    };

    const init = (name) => name ? name.split(' ').map(n => n[0]).join('').toUpperCase() : 'U';

    const card = (c, type) => {
      const name = type === 'sent' ? (c.postAuthor || 'Unknown') : (c.userName || 'Unknown');
      const school = type === 'sent' ? (c.postAuthorSchool || 'Unknown') : (c.userSchool || 'Unknown');
      const status = { accepted: 'status-accepted', pending: 'status-pending', rejected: 'status-rejected' }[c.status] || 'status-pending';

      return `
        <div class="collab-card">
          <div class="collab-card-header">
            <div class="project-title-row">
              <div class="project-icon"><i class="fas fa-folder"></i></div>
              <h3 class="project-title">${c.postTitle || 'Untitled'}</h3>
              <span class="status-badge ${status}">${c.status}</span>
            </div>
          </div>
          <div class="collab-card-body">
            <div class="collaborator-section">
              <div class="collaborator-avatar">${init(name)}</div>
              <div class="collaborator-info">
                <span class="collaborator-name">${name}</span>
                <span class="collaborator-school"><i class="fas fa-university"></i> ${school}</span>
              </div>
            </div>
            ${c.message ? `<div class="message-section"><div class="message-label"><i class="fas fa-comment-dots"></i> Message</div><p class="message-text">${c.message}</p></div>` : ''}
            <div class="meta-info">
              <div class="meta-item"><i class="fas fa-calendar"></i> ${ago(c.createdAt)}</div>
              ${c.acceptedAt ? `<div class="meta-item"><i class="fas fa-check-circle"></i> Accepted ${ago(c.acceptedAt)}</div>` : ''}
            </div>
            <div class="action-buttons">
              ${type === 'pending' ? `
                <button class="action-btn btn-accept" onclick="handle('${c.postId}','${c._id}','accepted')"><i class="fas fa-check"></i> Accept</button>
                <button class="action-btn btn-decline" onclick="handle('${c.postId}','${c._id}','rejected')"><i class="fas fa-times"></i> Decline</button>
              ` : type === 'active' ? `
                <button class="action-btn btn-view" onclick="view('${c.postId}')"><i class="fas fa-eye"></i> View</button>
                <button class="action-btn btn-message" onclick="msg('${c.userId}')"><i class="fas fa-comments"></i> Message</button>
              ` : type === 'sent' && c.status === 'pending' ? `
                <button class="action-btn btn-view" onclick="view('${c.postId}')"><i class="fas fa-eye"></i> View</button>
                <button class="action-btn btn-cancel" onclick="cancel('${c.postId}','${c._id}')"><i class="fas fa-times"></i> Cancel</button>
              ` : `<button class="action-btn btn-view" onclick="view('${c.postId}')"><i class="fas fa-eye"></i> View</button>`}
            </div>
          </div>
        </div>
      `;
    };

    const empty = (icon, title, desc, btnText, btnClick) => `
      <div class="empty-state">
        <i class="fas ${icon} empty-icon"></i>
        <h3 class="empty-title">${title}</h3>
        <p style="color: var(--color-text-secondary); margin-bottom: 16px;">${desc}</p>
        ${btnText ? `<button class="empty-action" onclick="${btnClick}"><i class="fas fa-plus"></i> ${btnText}</button>` : ''}
      </div>
    `;

    const render = () => {
      const active = received.filter(c => c.status === 'accepted');
      const pending = received.filter(c => c.status === 'pending');
      const all = [...received, ...sent];

      document.getElementById('activeCount').textContent = active.length;
      document.getElementById('pendingCount').textContent = pending.length;
      document.getElementById('sentCount').textContent = sent.filter(c => c.status === 'pending').length;
      document.getElementById('totalCount').textContent = all.length;

      document.getElementById('activeBadge').textContent = active.length;
      document.getElementById('pendingBadge').textContent = pending.length;
      document.getElementById('sentBadge').textContent = sent.filter(c => c.status === 'pending').length;

      document.getElementById('pendingGrid').innerHTML = pending.length ? pending.map(c => card(c, 'pending')).join('') : empty('fa-inbox', 'No Pending Requests', 'You have no collaboration requests waiting.', 'Browse Community', 'location.href="Community.html"');
      document.getElementById('activeGrid').innerHTML = active.length ? active.map(c => card(c, 'active')).join('') : empty('fa-handshake', 'No Active Collaborations', 'Start collaborating on projects!', 'Browse Community', 'location.href="Community.html"');
      document.getElementById('sentGrid').innerHTML = sent.length ? sent.map(c => card(c, 'sent')).join('') : empty('fa-paper-plane', 'No Sent Requests', 'You haven\'t sent any collaboration requests yet.', 'Browse Community', 'location.href="Community.html"');
      document.getElementById('historyGrid').innerHTML = all.length ? all.map(c => card(c, 'history')).join('') : empty('fa-history', 'No History', 'Your collaboration history will appear here.');
    };

    const load = async () => {
      try {
        const [r, s] = await Promise.all([
          api('/collaborations/requests'),
          api('/collaborations/sent')
        ]);
        received = r.success && r.data ? r.data : [];
        sent = s.success && s.data ? s.data : [];
        render();
      } catch (e) {
        console.error(e);
        toast(e.message, 'error');
      }
    };

    window.handle = async (postId, reqId, status) => {
      try {
        await api(`/collaborations/${postId}/${reqId}`, { method: 'PUT', body: JSON.stringify({ status }) });
        toast(`Request ${status}!`);
        load();
      } catch (e) {
        toast(e.message, 'error');
      }
    };

    window.cancel = async (postId, reqId) => {
      if (!confirm('Cancel this request?')) return;
      try {
        await api(`/collaborations/${postId}/${reqId}`, { method: 'DELETE' });
        toast('Request cancelled');
        load();
      } catch (e) {
        toast(e.message, 'error');
      }
    };

    window.view = (id) => location.href = `Community.html?post=${id}`;
    window.msg = () => toast('Messaging coming soon!');

    document.querySelectorAll('.tab-btn').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        document.getElementById(b.dataset.tab + 'Tab').classList.add('active');
      };
    });

    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
